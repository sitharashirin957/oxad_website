<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OXAD - Executive Digital Card</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Cropper.js for Image Cropping -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <style>
        :root {
            --primary: #2979ff;
            --primary-dark: #0d47a1;
            --bg-dark: #050608;
            --card-bg: #0e1017;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: white;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            perspective: 1400px;
        }

        /* Ambient International Glow Effect */
        .ambient-light {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 20% 40%, rgba(13, 71, 161, 0.22) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(41, 121, 255, 0.18) 0%, transparent 50%);
            z-index: -2;
            animation: breathe 10s infinite alternate ease-in-out;
        }

        @keyframes breathe {
            0% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.95); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
        }

        /* Ultra Premium Card Container */
        .digital-card {
            background: linear-gradient(160deg, #161923 0%, #0a0c10 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.95),
                        inset 0 2px 8px rgba(255, 255, 255, 0.08),
                        inset 0 -3px 15px rgba(41, 121, 255, 0.15);
            width: 92%;
            max-width: 400px;
            border-radius: 35px;
            padding: 40px 28px;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: rotateX(25deg) translateY(50px) scale(0.92);
            animation: cardEntrance 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform-style: preserve-3d;
            transition: transform 0.2s ease-out;
        }

        @keyframes cardEntrance {
            to { opacity: 1; transform: rotateX(0deg) translateY(0) scale(1); }
        }

        /* Rich Metallic Shimmer Effect */
        .shimmer-effect {
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, 
                rgba(255,255,255,0) 0%, 
                rgba(255,255,255,0.15) 50%, 
                rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            animation: shimmerSweep 6s infinite;
            z-index: 5;
            pointer-events: none;
        }

        @keyframes shimmerSweep {
            0% { left: -150%; }
            25% { left: 220%; }
            100% { left: 220%; }
        }

        .animate-item {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }
        .delay-4 { animation-delay: 0.8s; }

        .glass-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-4px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.4);
            border-color: rgba(41, 121, 255, 0.4);
        }

        .primary-gradient-btn {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            box-shadow: 0 12px 30px -5px rgba(41, 121, 255, 0.6);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }
        .primary-gradient-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 18px 35px -5px rgba(41, 121, 255, 0.8);
        }

        /* Floating Edit Button */
        .edit-fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FF416C 0%, #FF4B2B 100%);
            box-shadow: 0 10px 25px rgba(255, 65, 108, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .edit-fab:hover { transform: scale(1.12) rotate(15deg); }

        /* Modals */
        .custom-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
        }
        .custom-modal.active {
            opacity: 1;
            pointer-events: all;
        }
        .modal-content {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.12);
            width: 90%;
            max-width: 440px;
            border-radius: 28px;
            padding: 30px;
            transform: translateY(50px) scale(0.9);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 90vh;
            overflow-y: auto;
        }
        .custom-modal.active .modal-content {
            transform: translateY(0) scale(1);
        }

        /* Form Inputs */
        .input-group { margin-bottom: 16px; }
        .input-group label {
            display: block; font-size: 11px; color: #a0a0a0; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600;
        }
        .input-group input {
            width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12);
            color: white; padding: 12px 16px; border-radius: 12px; font-family: 'Montserrat', sans-serif; font-size: 14px;
        }
        .input-group input:focus { outline: none; border-color: var(--primary); background: rgba(41, 121, 255, 0.05); }
        
        /* Upload Wrapper */
        .file-upload-wrapper {
            position: relative; width: 100%; height: 90px; border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px; display: flex; flex-direction: column; justify-content: center;
            align-items: center; color: #aaa; cursor: pointer; transition: all 0.3s; overflow: hidden;
        }
        .file-upload-wrapper:hover { border-color: var(--primary); color: white; background: rgba(41, 121, 255, 0.04); }
        .file-upload-wrapper input[type="file"] {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
        }
        
        /* Cropper Container */
        .img-container {
            width: 100%;
            height: 280px;
            background-color: #000;
            margin-bottom: 15px;
            border-radius: 12px;
            overflow: hidden;
        }
        
        /* Loading Spinner */
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Profile Photo Styles */
        .profile-avatar-container {
            position: relative;
            width: 105px;
            height: 105px;
            margin: 0 auto 20px auto;
        }
        .profile-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #2979ff;
            box-shadow: 0 10px 25px rgba(41, 121, 255, 0.4);
            background: #111;
        }
    </style>
</head>
<body>

    <div class="ambient-light"></div>

    <!-- MAIN DIGITAL CARD -->
    <div class="digital-card" id="cardElement">
        <div class="shimmer-effect"></div>
        <div class="absolute -bottom-12 -right-12 w-44 h-44 bg-blue-600 rounded-full mix-blend-screen filter blur-[70px] opacity-25"></div>

        <!-- PROFILE PHOTO SECTION (Optional Display) -->
        <div class="text-center relative z-10 animate-item delay-1" id="profile-photo-wrapper" style="display: none;">
            <div class="profile-avatar-container">
                <img src="" alt="Profile Photo" class="profile-avatar" id="display-profile-photo">
            </div>
        </div>

        <!-- LOGO SECTION (Larger & Prominent) -->
        <div class="text-center mb-6 relative z-10 animate-item delay-1" id="logo-display-wrapper">
            <img src="" alt="Brand Logo" class="mx-auto h-36 max-w-[240px] object-contain mb-1 drop-shadow-2xl transition-all duration-500" id="display-logo" style="display: none;">
            <div id="logo-placeholder" class="h-28 flex items-center justify-center border border-dashed border-gray-700/80 rounded-2xl mb-1 text-gray-500 bg-black/20">
                <div class="text-center">
                    <i class="fas fa-gem text-3xl mb-2 text-blue-500/60"></i>
                    <p class="text-[11px] tracking-wider uppercase font-medium">OXAD Executive</p>
                </div>
            </div>
        </div>

        <!-- PROFILE DETAILS -->
        <div class="mb-6 text-center relative z-10 animate-item delay-2">
            <h2 class="text-2xl font-bold text-white mb-1 tracking-wider uppercase" id="display-name">YOUR NAME</h2>
            <p class="text-xs text-blue-400 mb-4 uppercase tracking-[0.2em] font-semibold" id="display-title">YOUR POSITION</p>
            
            <div class="inline-flex items-center gap-2 bg-white/5 border border-white/10 rounded-full px-4 py-2 backdrop-blur-md">
                <div class="w-7 h-7 rounded-full bg-blue-500/20 flex items-center justify-center text-blue-400">
                    <i class="fas fa-phone-alt text-xs"></i>
                </div>
                <a href="#" class="text-gray-200 text-sm font-medium tracking-wide hover:text-white transition" id="display-phone-link">
                    <span id="display-phone">+000 000 0000</span>
                </a>
            </div>
        </div>

        <!-- INTERNATIONAL BADGES / HIGHLIGHTS -->
        <div class="grid grid-cols-2 gap-3 mb-6 relative z-10 animate-item delay-3">
            <div class="bg-gradient-to-br from-white/[0.07] to-white/[0.02] border border-white/10 rounded-2xl p-3 text-center backdrop-blur-md shadow-inner">
                <div class="w-8 h-8 rounded-full bg-blue-500/20 flex items-center justify-center mx-auto mb-2 text-blue-400">
                    <i class="fas fa-chart-line text-xs"></i>
                </div>
                <p class="text-[9px] text-gray-300 font-bold tracking-widest uppercase">Growth &<br>Success</p>
            </div>
            <div class="bg-gradient-to-br from-white/[0.07] to-white/[0.02] border border-white/10 rounded-2xl p-3 text-center backdrop-blur-md shadow-inner">
                <div class="w-8 h-8 rounded-full bg-blue-500/20 flex items-center justify-center mx-auto mb-2 text-blue-400">
                    <i class="fas fa-shield-alt text-xs"></i>
                </div>
                <p class="text-[9px] text-gray-300 font-bold tracking-widest uppercase">Trust &<br>Reliability</p>
            </div>
        </div>

        <!-- ACTIONS BUTTONS -->
        <div class="flex flex-col gap-3 relative z-10 animate-item delay-4">
            <div class="flex gap-3">
                <a href="#" id="action-whatsapp" target="_blank" class="glass-btn flex-1 py-3 rounded-2xl text-center text-gray-200 flex items-center justify-center gap-2 text-xs font-bold uppercase tracking-wider">
                    <i class="fab fa-whatsapp text-green-400 text-lg"></i> Chat
                </a>
                <button onclick="shareCard()" class="glass-btn flex-1 py-3 rounded-2xl text-center text-gray-200 flex items-center justify-center gap-2 text-xs font-bold uppercase tracking-wider" id="share-btn-text">
                    <i class="fas fa-share-nodes text-blue-400"></i> <span id="share-text-span">Share</span>
                    <span class="loader" id="share-loader"></span>
                </button>
            </div>
            <button onclick="downloadVCard()" class="primary-gradient-btn w-full py-4 rounded-2xl font-bold text-xs flex items-center justify-center gap-2 text-white uppercase tracking-[0.15em]">
                <i class="fas fa-address-card text-base"></i> Save to Contacts
            </button>
        </div>
    </div>

    <!-- FLOATING EDIT BUTTON (Hidden in View Mode ?v=1) -->
    <div class="edit-fab" onclick="toggleModal('editModal')" title="Edit Card Details" id="editFab">
        <i class="fas fa-pen"></i>
    </div>

    <!-- EDIT / BUILDER MODAL -->
    <div class="custom-modal" id="editModal">
        <div class="modal-content relative">
            <button onclick="toggleModal('editModal')" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/10 flex items-center justify-center hover:bg-red-500 transition">
                <i class="fas fa-times"></i>
            </button>
            <h3 class="text-xl font-bold mb-6 text-white border-b border-gray-800 pb-3">Customize Card</h3>
            
            <!-- Logo Upload & Remove -->
            <div class="input-group">
                <label>Company Logo</label>
                <div class="flex gap-2">
                    <div class="file-upload-wrapper flex-1">
                        <i class="fas fa-cloud-upload-alt text-xl mb-1 text-blue-400"></i>
                        <span class="text-[11px]">Upload Logo</span>
                        <input type="file" id="upload-logo" accept="image/png, image/jpeg" onchange="initCropper(event, 'logo')">
                    </div>
                    <button type="button" onclick="removeLogo()" class="px-3 bg-red-500/20 border border-red-500/40 rounded-xl text-red-400 text-xs font-semibold hover:bg-red-500 hover:text-white transition" title="Remove Logo">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            </div>

            <!-- Profile Photo Upload & Remove -->
            <div class="input-group">
                <label>Profile Photo (Optional)</label>
                <div class="flex gap-2">
                    <div class="file-upload-wrapper flex-1">
                        <i class="fas fa-user-circle text-xl mb-1 text-blue-400"></i>
                        <span class="text-[11px]">Upload Photo</span>
                        <input type="file" id="upload-photo" accept="image/png, image/jpeg" onchange="initCropper(event, 'photo')">
                    </div>
                    <button type="button" onclick="removePhoto()" class="px-3 bg-red-500/20 border border-red-500/40 rounded-xl text-red-400 text-xs font-semibold hover:bg-red-500 hover:text-white transition" title="Remove Photo">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            </div>

            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="input-name" placeholder="E.g. NAME HERE">
            </div>

            <div class="input-group">
                <label>Position / Title</label>
                <input type="text" id="input-title" placeholder="E.g. Title Here">
            </div>

            <div class="input-group">
                <label>Phone Number (with Country Code)</label>
                <input type="text" id="input-phone" placeholder="E.g. 966500000000">
            </div>

            <button onclick="saveAndApply()" class="primary-gradient-btn w-full py-3.5 mt-2 rounded-xl font-bold text-xs uppercase tracking-wider text-white">
                <i class="fas fa-check-circle mr-2"></i> Save & Apply Changes
            </button>
        </div>
    </div>

    <!-- UNIVERSAL CROP MODAL -->
    <div class="custom-modal" id="cropModal" style="z-index: 2000;">
        <div class="modal-content relative">
            <h3 class="text-lg font-bold mb-4 text-white" id="cropModalTitle">Crop Image</h3>
            <div class="img-container">
                <img id="cropImage" src="" alt="Picture to crop" style="max-width: 100%;">
            </div>
            <div class="flex gap-3">
                <button onclick="cancelCrop()" class="glass-btn flex-1 py-2.5 rounded-xl text-xs font-bold uppercase">Cancel</button>
                <button onclick="saveCrop()" class="primary-gradient-btn flex-1 py-2.5 rounded-xl text-xs font-bold uppercase text-white">Crop & Apply</button>
            </div>
        </div>
    </div>

    <script>
        // Global State
        let cardData = {
            n: "NAME HERE",
            t: "Title Here",
            p: "966500000000",
            l: "", // Logo Base64
            ph: "" // Profile Photo Base64
        };

        let cropper = null;
        let currentCropType = 'logo'; // 'logo' or 'photo'
        let lastGeneratedShortUrl = null; 

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('v') || urlParams.get('v') === '1') {
                const editButton = document.getElementById('editFab');
                if (editButton) editButton.style.display = 'none';
            }

            const hash = window.location.hash;
            if (hash && hash.startsWith('#data=')) {
                try {
                    const encodedData = hash.substring(6);
                    const decodedStr = decodeURIComponent(atob(encodedData));
                    const parsedData = JSON.parse(decodedStr);
                    cardData = { ...cardData, ...parsedData };
                } catch(e) { console.error("Data parse error"); }
            }
            updateCardDisplay();
            populateForm();
        };

        function updateCardDisplay() {
            document.getElementById('display-name').textContent = cardData.n || 'YOUR NAME';
            document.getElementById('display-title').textContent = cardData.t || 'YOUR POSITION';
            
            let phoneDisplay = cardData.p || '0000000000';
            if(!phoneDisplay.startsWith('+')) phoneDisplay = '+' + phoneDisplay;
            document.getElementById('display-phone').textContent = phoneDisplay;
            
            let cleanPhone = (cardData.p || '').replace(/[^0-9]/g, '');
            document.getElementById('display-phone-link').href = `tel:+${cleanPhone}`;
            document.getElementById('action-whatsapp').href = `https://wa.me/${cleanPhone}`;

            // Logo Display Logic
            const logoImg = document.getElementById('display-logo');
            const placeholder = document.getElementById('logo-placeholder');
            
            if (cardData.l && cardData.l !== "") {
                logoImg.src = cardData.l;
                logoImg.style.display = 'block';
                placeholder.style.display = 'none';
            } else {
                logoImg.style.display = 'none';
                placeholder.style.display = 'flex';
            }

            // Profile Photo Display Logic
            const photoWrapper = document.getElementById('profile-photo-wrapper');
            const profilePhotoImg = document.getElementById('display-profile-photo');
            
            if (cardData.ph && cardData.ph !== "") {
                profilePhotoImg.src = cardData.ph;
                photoWrapper.style.display = 'block';
            } else {
                photoWrapper.style.display = 'none';
            }
        }

        function populateForm() {
            document.getElementById('input-name').value = cardData.n || '';
            document.getElementById('input-title').value = cardData.t || '';
            document.getElementById('input-phone').value = cardData.p || '';
        }

        function toggleModal(modalId) {
            document.getElementById(modalId).classList.toggle('active');
        }

        // --- CROPPER INITIALIZATION ---
        function initCropper(event, type) {
            currentCropType = type;
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('cropModalTitle').textContent = type === 'logo' ? 'Crop Company Logo' : 'Crop Profile Photo';

            const reader = new FileReader();
            reader.onload = function(e) {
                const image = document.getElementById('cropImage');
                image.src = e.target.result;
                
                toggleModal('cropModal'); 

                if(cropper) { cropper.destroy(); }
                cropper = new Cropper(image, {
                    viewMode: 1,
                    autoCropArea: 1,
                    aspectRatio: type === 'photo' ? 1 : NaN, // Square for photo, free for logo
                    background: false,
                    responsive: true
                });
            };
            reader.readAsDataURL(file);
            event.target.value = ''; 
        }

        function cancelCrop() {
            if(cropper) { cropper.destroy(); }
            toggleModal('cropModal');
        }

        function saveCrop() {
            if(!cropper) return;
            // Optimized dimensions and compression to keep URL length well within limits for TinyURL
            const maxDim = currentCropType === 'logo' ? 180 : 140;
            const canvas = cropper.getCroppedCanvas({
                maxWidth: maxDim, 
                maxHeight: maxDim
            });
            
            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.5);
            
            if (currentCropType === 'logo') {
                cardData.l = compressedBase64;
            } else {
                cardData.ph = compressedBase64;
            }

            lastGeneratedShortUrl = null; 
            cancelCrop();
            updateCardDisplay();
        }

        function removeLogo() {
            cardData.l = "";
            lastGeneratedShortUrl = null;
            updateCardDisplay();
        }

        function removePhoto() {
            cardData.ph = "";
            lastGeneratedShortUrl = null;
            updateCardDisplay();
        }

        // --- SAVE & APPLY ---
        window.lastGeneratedHash = "";

        function saveAndApply() {
            cardData.n = document.getElementById('input-name').value.trim();
            cardData.t = document.getElementById('input-title').value.trim();
            cardData.p = document.getElementById('input-phone').value.trim();

            updateCardDisplay();
            
            const jsonStr = JSON.stringify(cardData);
            const encodedData = btoa(encodeURIComponent(jsonStr));
            const hashData = '#data=' + encodedData;
            window.lastGeneratedHash = hashData;
            lastGeneratedShortUrl = null; 
            
            try {
                let cleanUrl = window.location.origin + window.location.pathname;
                const newUrl = cleanUrl + hashData;
                window.history.replaceState(null, '', newUrl);
            } catch (e) {
                try { window.location.hash = hashData; } catch (err) {}
            }

            toggleModal('editModal');
            
            const card = document.getElementById('cardElement');
            card.style.transform = 'scale(1.04)';
            setTimeout(() => { card.style.transform = 'scale(1)'; }, 300);
        }

        // --- SHARE CARD WITH VIEW MODE (Robust Shortener Fix) ---
        async function shareCard() {
            const btnText = document.getElementById('share-btn-text');
            const spanText = document.getElementById('share-text-span');
            const loader = document.getElementById('share-loader');
            
            let baseUrl = window.location.origin + window.location.pathname;
            
            if(baseUrl.includes('blob:') || baseUrl.includes('usercontent.goog')) {
                alert("⚠️ ശ്രദ്ധിക്കുക: നിങ്ങൾ ഇപ്പോൾ പ്രിവ്യൂ വിൻഡോയിലാണ് ഉള്ളത്.\n\nഇതിൽ നിന്നും നേരിട്ട് ലിങ്ക് ഷെയർ ചെയ്യാൻ കഴിയില്ല. ദയവായി കോഡ് ഡൗൺലോഡ് ചെയ്ത് tiiny.host അല്ലെങ്കിൽ Vercel-ൽ ഹോസ്റ്റ് ചെയ്ത ശേഷം ഷെയർ ചെയ്യുക!");
                return;
            }
            
            let longUrl = baseUrl;
            if (!longUrl.includes('?')) {
                longUrl += '?v=1';
            } else {
                longUrl += '&v=1';
            }
            longUrl += (window.lastGeneratedHash || window.location.hash);

            let shareUrl = longUrl;

            if(!lastGeneratedShortUrl) {
                spanText.textContent = " Generating...";
                loader.style.display = 'inline-block';
                
                try {
                    const response = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`);
                    if(response.ok) {
                        const shortText = await response.text();
                        if(shortText && shortText.startsWith('http')) {
                            shareUrl = shortText;
                            lastGeneratedShortUrl = shareUrl;
                        }
                    }
                } catch(err) {
                    console.log("URL shortener fallback to long URL.", err);
                }
                
                loader.style.display = 'none';
                spanText.textContent = " Share";
            } else {
                shareUrl = lastGeneratedShortUrl;
            }

            const shareData = {
                title: `${cardData.n} - Executive Digital Card`,
                text: `Here is my official digital business card. Click to view!`,
                url: shareUrl
            };

            const originalHTML = btnText.innerHTML;

            if (navigator.share) {
                navigator.share(shareData).catch(() => {
                    fallbackCopy(shareUrl, btnText, originalHTML);
                });
            } else {
                fallbackCopy(shareUrl, btnText, originalHTML);
            }
        }

        function fallbackCopy(url, btnElement, originalHTML) {
            const textArea = document.createElement("textarea");
            textArea.value = url;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                btnElement.innerHTML = '<i class="fas fa-check text-green-400"></i> Copied!';
                setTimeout(() => { btnElement.innerHTML = originalHTML; }, 2000);
            } catch (err) {
                console.error('Failed to copy', err);
                alert("Share Link: " + url);
            }
            document.body.removeChild(textArea);
        }
        
        // --- SAVE TO CONTACTS ---
        function downloadVCard() {
            const cleanPhone = (cardData.p || '').replace(/[^0-9+]/g, '');
            const phoneStr = cleanPhone.startsWith('+') ? cleanPhone : '+' + cleanPhone;
            const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:${cardData.n || ''}\nORG:OXAD BUSINESS SOLUTION\nTITLE:${cardData.t || ''}\nTEL;TYPE=WORK,VOICE:${phoneStr}\nEND:VCARD`;
            const blob = new Blob([vcard], { type: 'text/vcard' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${(cardData.n || 'Contact').replace(/\s+/g, '_')}.vcf`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // --- 3D TILT EFFECT ---
        const card = document.getElementById('cardElement');
        document.addEventListener('mousemove', (e) => {
            if(window.innerWidth > 768 && !document.getElementById('editModal').classList.contains('active') && !document.getElementById('cropModal').classList.contains('active')) {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
                card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            }
        });
        
        document.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateY(0deg) rotateX(0deg)';
        });
    </script>
</body>
</html>
